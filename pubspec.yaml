name: hrr_app
description: "HRR - Trasforma ogni viaggio in un'esperienza racing"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.2.0

  # Backend / Supabase
  supabase_flutter: ^2.5.6

  # Firebase (push, crash)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  firebase_crashlytics: ^4.0.4
  # System notification Android in foreground: FCM non la mostra da solo
  # in quello stato (solo background/terminata), vedi local_notifications_
  # service.dart.
  flutter_local_notifications: ^18.0.1

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  maplibre_gl: ^0.26.2
  # Upgrade del permesso di localizzazione a "Always" su iOS: dopo un primo
  # grant "When In Use", una seconda chiamata a Geolocator.requestPermission()
  # non richiede più nulla all'utente (ritorna subito lo stato corrente) — solo
  # permission_handler gestisce correttamente il prompt di upgrade nativo.
  permission_handler: ^11.3.1

  # Sensori inerziali (accelerometro/giroscopio) per telemetria di guida
  sensors_plus: ^7.1.0

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  rive: ^0.13.13

  # Images
  cached_network_image: ^3.4.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.6

  # ML / Car recognition
  tflite_flutter: ^0.11.0
  image: ^4.2.0

  # Utils
  equatable: ^2.0.5
  dio: ^5.5.0+1
  logger: ^2.4.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  timezone: ^0.9.4
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.4
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icona.png"
  # Apple rifiuta icone con canale alpha: l'icona sorgente ha angoli
  # trasparenti (immagine con sfondo rimosso), quindi su iOS va appiattita
  # su uno sfondo pieno — stesso sfondo scuro del tema app (guidaBg).
  remove_alpha_ios: true
  background_color_ios: "#060810"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/rive/
    - assets/icons/
    - assets/mascots/
    - assets/poses/
    - assets/emotes/
    - .env
  # Orbitron/Inter sono serviti via google_fonts (vedi core/theme/app_theme.dart)
  # invece di file .ttf committati — nessun binario di font da gestire.
